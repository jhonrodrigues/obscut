recording:
  # MKV crescente gravado pelo OBS (ver obs-config/README-obs-setup.md)
  file: "./grava/culto.mkv"
  audio_track: 0

detector:
  hop_seconds: 1.0

signals:
  aplauso:
    classes: ["Applause", "Clapping"]
    threshold: 0.5
    min_sustain: 2.0
    pre_seconds: 5
    post_seconds: 25
  pregador:
    enabled: true
    threshold: 0.5
    min_sustain: 1.5
    pre_seconds: 3
    post_seconds: 20
    baseline_seconds: 15
    spike_factor: 2.5
    speech_min: 0.3

clipper:
  cooldown_seconds: 60
  output_dir: "./cultos"

test:
  clip_at: 8.0
  start: 3.0
  end: 33.0