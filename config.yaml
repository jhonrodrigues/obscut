recording:
  # type: file = MKV crescente do OBS | stream = entrada ffmpeg genérica (NDI, URL, dispositivo)
  type: "file"
  file: "./grava/culto.mkv"
  audio_track: 0
  # só p/ type: stream. Ex.: NDI (precisa ffmpeg com libndi_newtek):
  #   ["-f", "libndi_newtek", "-i", "NomeCanal"]
  # teste sem NDI:
  #   ["-f", "lavfi", "-i", "sine=frequency=440:duration=30"]
  stream_args: ["-f", "libndi_newtek", "-i", "CanalNDI"]

detector:
  hop_seconds: 1.0

signals:
  aplauso:
    classes: ["Applause", "Clapping"]
    threshold: 0.5
    min_sustain: 2.0
    pre_seconds: 5
    post_seconds: 25
  pregador:
    enabled: true
    threshold: 0.5
    min_sustain: 1.5
    pre_seconds: 3
    post_seconds: 20
    baseline_seconds: 15
    spike_factor: 2.5
    speech_min: 0.3
  keywords:
    enabled: true
    threshold: 0.6
    min_sustain: 1.5
    pre_seconds: 4
    post_seconds: 30
    batch_seconds: 10
    model_size: "small"
    language: "pt"
    score_divisor: 8.0
    words:
      "glória a deus": 8
      "vamos adorar": 7
      "levanta as mãos": 6
      "profetizo": 6
      "aleluia": 2
      "amém": 1

clipper:
  cooldown_seconds: 60
  output_dir: "./cultos"

server:
  # painel visual no OBS: Dock → Custom Browser Docks → http://127.0.0.1:8765
  host: "127.0.0.1"
  port: 8765

test:
  clip_at: 8.0
  start: 3.0
  end: 33.0