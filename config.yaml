recording:
  # MKV crescente gravado pelo OBS (ver obs-config/README-obs-setup.md)
  file: "./grava/culto.mkv"
  audio_track: 0

detector:
  hop_seconds: 1.0
  threshold: 0.5
  min_sustain_seconds: 2.0
  # classes do AudioSet/YAMNet. Applause = aplauso real; Clapping ajuda no teste sintético
  classes: ["Applause", "Clapping"]

clipper:
  pre_seconds: 5
  post_seconds: 25
  min_duration_seconds: 4
  cooldown_seconds: 60
  output_dir: "./cultos"
  label: "aplauso"

test:
  clip_at: 8.0
  start: 3.0
  end: 33.0